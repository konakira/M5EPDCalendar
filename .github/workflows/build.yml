name: PlatformIO CI

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'  # Changes to files ending in ".md" will skip the test!
      - '.gitignore'
      - 'images/**'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Prepare auth.h (Dummy for build)
      run: cp auth.h.example auth.h

    - name: Run PlatformIO Build
      run: pio run